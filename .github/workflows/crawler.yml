name: Hot News Crawler
on:
  schedule:
    # 每小时整点运行一次
    - cron: "0 * * * *"
  workflow_dispatch:

# 添加权限设置
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Verify required files
        run: |
          echo "🔍 检查必需的配置文件..."
          if [ ! -f config/config.yaml ]; then
            echo "❌ 错误: config/config.yaml 文件不存在"
            echo "请参考项目文档创建配置文件"
            exit 1
          fi
          if [ ! -f config/frequency_words.txt ]; then
            echo "❌ 错误: config/frequency_words.txt 文件不存在"
            echo "请参考项目文档创建频率词配置文件"
            exit 1
          fi
          echo "✅ 配置文件检查通过"

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          GITHUB_ACTIONS: true
        run: python main.py

      - name: Push to WeWork/DingTalk with AI Summary
        env:
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: |
          python3 - << 'EOF'
          import requests
          import json
          import os

          # 读取爬虫生成的热点数据
          try:
              with open('hot_news.json', 'r', encoding='utf-8') as f:
                  hot_news = json.load(f)
          except FileNotFoundError:
              print("⚠️  热点数据文件未找到，跳过推送")
              exit(0)

          # 生成推送内容
          push_content = "📰 【热点推送】\n"
          for i, news in enumerate(hot_news[:5]):
              push_content += f"{i+1}. {news['title']}\n🔗 链接：{news['url']}\n\n"

          # 推送到企业微信
          if os.environ.get("WEWORK_WEBHOOK_URL"):
              try:
                  wework_res = requests.post(
                      os.environ["WEWORK_WEBHOOK_URL"],
                      json={"msgtype": "text", "text": {"content": push_content}},
                      timeout=10
                  )
                  wework_res.raise_for_status()
                  print("✅ 推送企业微信成功")
              except Exception as e:
                  print(f"❌ 推送企业微信失败：{e}")

          # 推送到钉钉
          if os.environ.get("DINGTALK_WEBHOOK_URL") and os.environ.get("DINGTALK_SECRET"):
              try:
                  dingtalk_res = requests.post(
                      os.environ["DINGTALK_WEBHOOK_URL"],
                      json={"msgtype": "text", "text": {"content": push_content}},
                      timeout=10
                  )
                  dingtalk_res.raise_for_status()
                  print("✅ 推送钉钉成功")
              except Exception as e:
                  print(f"❌ 推送钉钉失败：{e}")
          EOF

      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Update hot news"
          git push 
